[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-massprops"
version = "0.1.0"
description = "Mass, CG and moment-of-inertia budgets for small vertical rockets and VTVL hoppers, including TVC lever arm and control authority as the tanks drain."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ivan Sushko"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["rocketry", "mass properties", "center of gravity", "moment of inertia", "TVC", "VTVL"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest"]

[project.scripts]
massprops = "massprops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
