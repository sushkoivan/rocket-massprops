name: Publish to PyPI
# Runs when a GitHub release is published. Uses PyPI trusted publishing (no API token stored in the repo):
# on pypi.org add a "pending publisher" for this repository, workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
